# Основной HTTPS-сервер
server {
    listen 80;
    listen 443 ssl;
    server_name artemii-kittygram.ddns.net;

    ssl_certificate ssl.crt;
    ssl_certificate_key ssl.key;

    client_max_body_size 20M;

    # Проксируем весь корень в Django Kittygram
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }

    # Статика и медиа (отдаём напрямую, без Django)
    location /static/ {
        alias /home/ubuntu/infra_sprint1/frontend/build/static/;
    }

    location /media/ {
        alias /home/ubuntu/infra_sprint1/backend/media/;
    }

    # Taski на пути /taski/
    location /taski/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
