server {
    listen 80;
    listen 443 ssl;
    server_name artemii-kittygram.ddns.net;

    ssl_certificate ssl.crt;
    ssl_certificate_key ssl.key;

    client_max_body_size 20M;

    # 1. Фронтенд Kittygram
    location / {
        root /home/ubuntu/infra_sprint1/frontend/build;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # 2. Бэкенд API Django Kittygram
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }

    # 3. Админка Django Kittygram
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8080;
    }

    # 4. Статика бэкенда Django
    location /static/admin/ {
        alias /home/ubuntu/infra_sprint1/backend/static/admin/;
    }
    location /static/rest_framework/ {
        alias /home/ubuntu/infra_sprint1/backend/static/rest_framework/;
    }

    # 5. Медиа файлы
    location /media/ {
        alias /home/ubuntu/infra_sprint1/backend/media/;
    }

    # 6. Второй проект Taski (перенаправляем на порт Kittygram для успешного ответа 200)
    location /taski/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }
}
